name: Link Checker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'  # Runs every Sunday at midnight
  workflow_dispatch:  # Allows manual trigger anytime

jobs:
  lychee-link-check:
    name: Lychee - Check Repo Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,301,429
            --exclude "^https?://localhost"
            --exclude "^data:"
            --exclude "\$\{\{"
            --exclude "%7B%7B"
            --exclude "^https?://(www\.)?(x|twitter)\.com"
            --exclude-path "./backend/templates"
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Lychee results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lychee-results
          path: lychee/out.md
