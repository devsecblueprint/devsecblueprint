name: Security Scan

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    # Weekly re-scan to surface newly-disclosed CVEs against unchanged code
    - cron: "0 6 * * 1"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

# ---------------------------------------------------------------------------
# Security-tool ownership
#
# Trivy answers exactly two questions for DSB, split into two jobs below:
#   1. trivy-iac   : is our Terraform configuration secure?
#   2. trivy-image : is the container image we actually ship free of
#                    unacceptable known vulnerabilities?
#
# Trivy is deliberately NOT the control for:
#   - npm / uv dependency CVEs .... Dependabot (see .github/dependabot.yml)
#   - source-code SAST ........... CodeQL (below), Semgrep, SonarQube
#   - repository secret scanning .. currently uncovered; see docs/SECURITY_SCANNING.md
#
# See docs/SECURITY_SCANNING.md for the full ownership matrix and the
# HIGH/CRITICAL gating policy.
# ---------------------------------------------------------------------------

jobs:
  trivy-iac:
    name: Trivy IaC (Terraform misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy Terraform misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif
          # REQUIRED. trivy-action's entrypoint unsets TRIVY_SEVERITY whenever
          # format=sarif unless this is true, which would silently widen the
          # gate from HIGH,CRITICAL to every severity (31 findings here, not 11)
          # and flood Code Scanning with LOW/MEDIUM alerts.
          limit-severities-for-sarif: true
          skip-dirs: "**/.terraform"
      # Trivy's config-scan SARIF has no run-level `artifacts` array (verified
      # against real `trivy config` output) — only `originalUriBaseIds.ROOTPATH`,
      # an absolute path into the runner's checkout of terraform/, and per-result
      # `physicalLocation.artifactLocation.uri` paths relative to it. GitHub
      # Code Scanning resolves URIs against the repository root, so without
      # this step the alerts upload but do not anchor to any file. Re-root the
      # paths and drop the now-meaningless base.
      - name: Re-root SARIF paths at the repository root
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("trivy-iac.sarif")
          if not p.exists():
              raise SystemExit(0)
          doc = json.loads(p.read_text())
          for run in doc.get("runs", []):
              run.pop("originalUriBaseIds", None)
              for result in run.get("results", []):
                  locs = (result.get("locations") or []) + (result.get("relatedLocations") or [])
                  for loc in locs:
                      art = loc.get("physicalLocation", {}).get("artifactLocation", {})
                      if art.get("uri") and not art["uri"].startswith("terraform/"):
                          art["uri"] = f"terraform/{art['uri']}"
                      art.pop("uriBaseId", None)
          p.write_text(json.dumps(doc))
          PY
      - name: Upload IaC SARIF to Code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  trivy-image:
    name: Trivy Image (backend production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mirrors tasks.py::build_image, which is the production build path
      # invoked by deploy.yml (`invoke deploy-all`). Keep these two in sync.
      # --platform is omitted: tasks.py only adds it on macOS hosts, and
      # GitHub's ubuntu-latest runners are already linux/amd64.
      - name: Build backend production image
        run: docker build -t dsb-platform:${{ github.sha }} backend/

      # `scanners: vuln` is explicit: secret scanning is no longer Trivy's
      # responsibility, in the filesystem or in the image.
      # `vuln-type: os,library` is the default, stated explicitly to document
      # that both the Debian base layer and the installed Python packages
      # are in scope.
      # `ignore-unfixed: true` gates only on what we can act on — see the
      # "Image gating policy" section of docs/SECURITY_SCANNING.md.
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: dsb-platform:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          # REQUIRED — see the note on the IaC job above. Without this,
          # format=sarif causes trivy-action to drop the severity filter.
          limit-severities-for-sarif: true

      - name: Upload image SARIF to Code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@v7

      # build-mode: none skips any compile step. CodeQL analyses Python
      # and JS/TS sources directly, which avoids running the Next.js
      # generate/build pipeline as part of the scan.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
