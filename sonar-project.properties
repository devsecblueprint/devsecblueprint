sonar.projectKey=devsecblueprint_devsecblueprint_4b382cb2-090e-4a59-821f-d7cd711d1705
sonar.sources=backend,frontend,terraform
sonar.sourceEncoding=UTF-8
sonar.exclusions=frontend/lib/curriculum-data.ts,frontend/lib/walkthroughs-data.ts,frontend/app/**/page.tsx,**/node_modules/**,**/.terraform/**,**/*.tfstate,**/*.tfstate.*,**/dist/**,**/build/**,**/out/**,**/coverage/**,**/__pycache__/**,**/*.pyc
sonar.python.version=3.12

# --- Tests ---
# Keep test code out of `sonar.sources` and declare it here so Sonar attributes
# it correctly (and does not count it as production code to be covered).
sonar.tests=tests,frontend/__tests__
sonar.test.inclusions=tests/**/*.py,frontend/__tests__/**/*.{ts,tsx}

# --- Coverage reports ---
# SonarQube imports coverage; it does not compute it. These reports are
# produced by the CI test jobs (jest --coverage, coverage.py xml) and made
# available to the scanner via downloaded artifacts.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Files to ignore for coverage (generated / entrypoints / config).
sonar.coverage.exclusions=frontend/app/**/page.tsx,frontend/app/**/layout.tsx,frontend/scripts/**,frontend/**/*.config.{js,ts},frontend/jest.setup.js,backend/**/__init__.py,terraform/**
